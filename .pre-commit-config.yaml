repos:

# repo-guard:base:start
  - repo: local
    hooks:
      - id: risky-filenames
        name: risky filenames
        entry: |-
          bash -lc '
            status=0
            for f in "$@"; do
              case "$f" in
                .env|.env.*|*.env|*env*|*.local|*.secret|*.secrets|*.token|*.tokens)
                  printf "refusing risky path=%s\n" "$f"
                  status=1
                  ;;
                *.pem|*.key|*.p12|*.pfx|*.crt|*.csr|*.ovpn|*.asc|*.kdbx|*.sqlite|*.sqlite3)
                  printf "refusing risky path=%s\n" "$f"
                  status=1
                  ;;
                *.db|*.rdb|*.bak|*.backup|*.gpg|*.age|id_rsa|id_rsa.*|id_ed25519|id_ed25519.*)
                  printf "refusing risky path=%s\n" "$f"
                  status=1
                  ;;
                known_hosts|authorized_keys|auth.json|auth.json.*|credentials|credentials.*)
                  printf "refusing risky path=%s\n" "$f"
                  status=1
                  ;;
                secrets|secrets.*|.npmrc|.pypirc|.netrc|.docker/config.json|.envrc|.aws/*|.ssh/*)
                  printf "refusing risky path=%s\n" "$f"
                  status=1
                  ;;
                .gnupg/*|.config/*|Library/Keychains/*|history.jsonl|sessions/*|log/*)
                  printf "refusing risky path=%s\n" "$f"
                  status=1
                  ;;
                Library/Application\ Support/Google/Chrome/*)
                  printf "refusing risky path=%s\n" "$f"
                  status=1
                  ;;
                Library/Application\ Support/Chromium/*)
                  printf "refusing risky path=%s\n" "$f"
                  status=1
                  ;;
                Library/Application\ Support/BraveSoftware/*)
                  printf "refusing risky path=%s\n" "$f"
                  status=1
                  ;;
                Library/Application\ Support/Firefox/*)
                  printf "refusing risky path=%s\n" "$f"
                  status=1
                  ;;
              esac
            done
            exit "$status"
          ' --
        language: system
      - id: merge-conflict
        name: merge conflict markers
        entry: >-
          bash -lc 'if [ "$#" -eq 0 ]; then exit 0; fi; rg -n --
          "^(<<<<<<<|=======|>>>>>>>)" "$@"; status=$?; if [ "$status" -eq
          1 ]; then exit 0; fi; exit "$status"'
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trailing whitespace
        entry: >-
          bash -lc 'if [ "$#" -eq 0 ]; then exit 0; fi; rg -n --
          "[[:blank:]]$" "$@"; status=$?; if [ "$status" -eq 1 ]; then exit
          0; fi; exit "$status"'
        language: system
        types: [text]
      - id: detect-private-key
        name: private key markers
        entry: >-
          bash -lc 'if [ "$#" -eq 0 ]; then exit 0; fi; rg -n --
          "-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----" "$@"; status=$?; if
          [ "$status" -eq 1 ]; then exit 0; fi; exit "$status"'
        language: system
        types: [text]
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact
        language: system
        pass_filenames: false
# repo-guard:base:end

# repo-guard:python:start
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: >-
          bash -lc 'if [ -n "${VIRTUAL_ENV:-}" ] && [ -x
          "$VIRTUAL_ENV/bin/ruff" ]; then "$VIRTUAL_ENV/bin/ruff" check
          --fix "$@"; elif [ -x ./.venv/bin/ruff ]; then
          ./.venv/bin/ruff check --fix "$@"; elif [ -x ./venv/bin/ruff ];
          then ./venv/bin/ruff check --fix "$@"; else ruff check --fix
          "$@"; fi' --
        language: system
        files: \.pyi?$
      - id: ruff-format
        name: ruff format
        entry: >-
          bash -lc 'if [ -n "${VIRTUAL_ENV:-}" ] && [ -x
          "$VIRTUAL_ENV/bin/ruff" ]; then "$VIRTUAL_ENV/bin/ruff" format
          "$@"; elif [ -x ./.venv/bin/ruff ]; then ./.venv/bin/ruff format
          "$@"; elif [ -x ./venv/bin/ruff ]; then ./venv/bin/ruff format
          "$@"; else ruff format "$@"; fi' --
        language: system
        files: \.pyi?$
      - id: bandit
        name: bandit
        entry: >-
          bash -lc 'if [ -n "${VIRTUAL_ENV:-}" ] && [ -x
          "$VIRTUAL_ENV/bin/bandit" ]; then "$VIRTUAL_ENV/bin/bandit" -q
          "$@"; elif [ -x ./.venv/bin/bandit ]; then ./.venv/bin/bandit -q
          "$@"; elif [ -x ./venv/bin/bandit ]; then ./venv/bin/bandit -q
          "$@"; else bandit -q "$@"; fi' --
        language: system
        files: \.pyi?$
      - id: radon-cc
        name: radon complexity
        entry: >-
          bash -lc 'if [ -n "${VIRTUAL_ENV:-}" ] && [ -x
          "$VIRTUAL_ENV/bin/radon" ]; then "$VIRTUAL_ENV/bin/radon" cc -s
          -n B "$@"; elif [ -x ./.venv/bin/radon ]; then
          ./.venv/bin/radon cc -s -n B "$@"; elif [ -x ./venv/bin/radon ];
          then ./venv/bin/radon cc -s -n B "$@"; else radon cc -s -n B
          "$@"; fi' --
        language: system
        files: \.pyi?$
      - id: vulture
        name: vulture dead code
        entry: >-
          bash -lc 'if [ -n "${VIRTUAL_ENV:-}" ] && [ -x
          "$VIRTUAL_ENV/bin/vulture" ]; then "$VIRTUAL_ENV/bin/vulture"
          --min-confidence 80 "$@"; elif [ -x ./.venv/bin/vulture ]; then
          ./.venv/bin/vulture --min-confidence 80 "$@"; elif [ -x
          ./venv/bin/vulture ]; then ./venv/bin/vulture --min-confidence 80
          "$@"; else vulture --min-confidence 80 "$@"; fi' --
        language: system
        files: \.pyi?$
      - id: pip-audit
        name: pip audit
        entry: >-
          bash -lc 'if [ -f requirements.txt ]; then if [ -n
          "${VIRTUAL_ENV:-}" ] && [ -x "$VIRTUAL_ENV/bin/pip-audit" ]; then
          "$VIRTUAL_ENV/bin/pip-audit" -r requirements.txt; elif [ -x
          ./.venv/bin/pip-audit ]; then ./.venv/bin/pip-audit -r
          requirements.txt; elif [ -x ./venv/bin/pip-audit ]; then
          ./venv/bin/pip-audit -r requirements.txt; else pip-audit -r
          requirements.txt; fi; elif [ -f pyproject.toml ]; then if [ -n
          "${VIRTUAL_ENV:-}" ] && [ -x "$VIRTUAL_ENV/bin/pip-audit" ]; then
          "$VIRTUAL_ENV/bin/pip-audit"; elif [ -x ./.venv/bin/pip-audit ];
          then ./.venv/bin/pip-audit; elif [ -x ./venv/bin/pip-audit ]; then
          ./venv/bin/pip-audit; else pip-audit; fi; else echo "no Python
          dependency manifest found, skipping pip-audit"; fi'
        language: system
        pass_filenames: false
# repo-guard:python:end

# repo-guard:bash:start
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: shfmt -w -i 2 -ci
        language: system
        files: \.(sh|bash)$
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.(sh|bash)$
      - id: bash-syntax
        name: bash syntax
        entry: bash -n
        language: system
        files: \.(sh|bash)$
# repo-guard:bash:end

# repo-guard:javascript:start
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: >-
          bash -lc '
            if [ ! -f eslint.config.js ] && [ ! -f eslint.config.mjs ] && [ ! -f eslint.config.cjs ] && [ ! -f .eslintrc.js ] && [ ! -f .eslintrc.json ] && [ ! -f .eslintrc.yaml ] && [ ! -f .eslintrc.yml ]; then
              echo "eslint: no config found, skipping"; exit 0;
            fi;
            if [ -x ./node_modules/.bin/eslint ]; then ./node_modules/.bin/eslint "$@"; else eslint "$@"; fi' --
        language: system
        files: \.(js|jsx|mjs|cjs)$
      - id: prettier
        name: prettier
        entry: >-
          bash -lc 'if [ -x ./node_modules/.bin/prettier ]; then
          ./node_modules/.bin/prettier --write "$@"; else prettier --write
          "$@"; fi' --
        language: system
        files: \.(js|jsx|mjs|cjs|json|md|yaml|yml)$
        exclude: ^\.pre-commit-config\.yaml$
# repo-guard:javascript:end

# repo-guard:typescript:start
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: >-
          bash -lc '
            if [ ! -f eslint.config.js ] && [ ! -f eslint.config.mjs ] && [ ! -f eslint.config.cjs ] && [ ! -f .eslintrc.js ] && [ ! -f .eslintrc.json ] && [ ! -f .eslintrc.yaml ] && [ ! -f .eslintrc.yml ]; then
              echo "eslint: no config found, skipping"; exit 0;
            fi;
            if [ -x ./node_modules/.bin/eslint ]; then ./node_modules/.bin/eslint "$@"; else eslint "$@"; fi' --
        language: system
        files: \.(ts|tsx|mts|cts)$
      - id: prettier
        name: prettier
        entry: >-
          bash -lc 'if [ -x ./node_modules/.bin/prettier ]; then
          ./node_modules/.bin/prettier --write "$@"; else prettier --write
          "$@"; fi' --
        language: system
        files: \.(ts|tsx|mts|cts|json|md|yaml|yml)$
        exclude: ^\.pre-commit-config\.yaml$
      - id: tsc-noemit
        name: tsc --noEmit
        entry: >-
          bash -lc '
            TSC=$([ -x ./node_modules/.bin/tsc ] && echo ./node_modules/.bin/tsc || echo tsc);
            for cfg in packages/shared/tsconfig.json apps/api/tsconfig.json apps/web/tsconfig.json; do
              [ -f "$cfg" ] && "$TSC" -p "$cfg" --noEmit || true;
            done'
        language: system
        files: \.(ts|tsx|mts|cts)$
        pass_filenames: false
# repo-guard:typescript:end
