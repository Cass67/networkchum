name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/native-console-bridge-go/go.mod
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Build source bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix="networkchum-${version}/" \
            -o "networkchum-${version}.tar.gz" HEAD
      - name: Build console bridge bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p bridge
          cp tools/native-console-bridge/server.js \
             tools/native-console-bridge/run.sh \
             tools/native-console-bridge/run.cmd \
             tools/native-console-bridge/README.md bridge/
          chmod +x bridge/run.sh
          tar -czf "networkchum-console-bridge-${version}.tar.gz" -C bridge .
      - name: Test console bridge
        run: |
          cd tools/native-console-bridge-go
          go vet ./...
          go test ./...
      - name: Build console bridge binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p bin
          cd tools/native-console-bridge-go
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="../../bin/networkchum-console-bridge-${version}-${os}-${arch}"
            if [ "$os" = "windows" ]; then out="${out}.exe"; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$out" .
          done
          chmod +x ../../bin/networkchum-console-bridge-* 2>/dev/null || true
          cd ../..
          sha256sum networkchum-*.tar.gz bin/* > SHA256SUMS
          ls -lh bin
      - name: Extract release notes
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            networkchum-*.tar.gz
            bin/*
            SHA256SUMS
