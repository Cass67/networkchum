name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Build source bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix="networkchum-${version}/" \
            -o "networkchum-${version}.tar.gz" HEAD
          sha256sum "networkchum-${version}.tar.gz" > SHA256SUMS
      - name: Extract release notes
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            networkchum-*.tar.gz
            SHA256SUMS
