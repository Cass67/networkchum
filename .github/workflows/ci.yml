name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify lockfile is in sync
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json \
            || (echo "::error::package-lock.json is out of sync with package.json"; exit 1)
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/native-console-bridge-go/go.mod
      - name: Vet and test the console bridge
        run: |
          cd tools/native-console-bridge-go
          go vet ./...
          go test ./...
